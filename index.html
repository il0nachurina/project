<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер привычек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2 id="hello">Привычки</h2>
  <p id="currentDate"></p>

  <input id="name" placeholder="Новая привычка">
  <button id="addButton" onclick="add()" disabled>Добавить</button>

  <ul id="list"></ul>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById('hello').textContent =
      'Привет, ' + (tg.initDataUnsafe.user?.first_name || 'гость') + '!';

    let habits = [];
    let loaded = false;
    let lastDate = '';

    // Формирование даты
    function today(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    // Подсчёт последовательных дней выполнения
    function getStreak(habit) {
      const dates = new Set(habit.completedDates);
      const date = new Date();
      date.setHours(12, 0, 0, 0);

      let streak = 0;

      // Если сегодня привычка ещё не выполнена,
      // проверяем серию до вчерашнего дня
      if (!dates.has(today(date))) {
        date.setDate(date.getDate() - 1);
      }

      while (dates.has(today(date))) {
        streak++;
        date.setDate(date.getDate() - 1);
      }

      return streak;
    }

    // Сохранение привычек
    function save() {
      tg.CloudStorage.setItem(
        'habits',
        JSON.stringify(habits),
        (err) => {
          if (err) alert('Не удалось сохранить изменения');
        }
      );
    }

    // Отображение привычек
    function render() {
      if (!loaded) return;

      lastDate = today();

      document.getElementById('currentDate').textContent =
        'Сегодня: ' + new Date().toLocaleDateString('ru-RU');

      const ul = document.getElementById('list');
      ul.innerHTML = '';

      habits.forEach((h, index) => {
        const li = document.createElement('li');
        const text = document.createElement('span');

        const completed = h.completedDates.includes(lastDate);
        const streak = getStreak(h);

        text.textContent =
          (completed ? '✅ ' : '⬜ ') + h.name;

        li.appendChild(text);

        // Отображение серии
        const series = document.createElement('span');
        series.textContent = ' 🔥 Серия: ' + streak + ' дн.';
        series.style.marginLeft = '8px';
        series.style.color = '#e67e22';

        li.appendChild(series);

        // Отметка выполнения за сегодняшний день
        li.onclick = () => {
          const date = today();

          if (h.completedDates.includes(date)) {
            h.completedDates = h.completedDates.filter(
              d => d !== date
            );
          } else {
            h.completedDates.push(date);
          }

          h.done = h.completedDates.includes(date);

          save();
          render();
        };

        // Кнопка удаления
        const del = document.createElement('button');
        del.textContent = '🗑';
        del.title = 'Удалить привычку';
        del.style.marginLeft = '8px';

        del.onclick = (e) => {
          e.stopPropagation();
          removeHabit(index);
        };

        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    // Добавление привычки
    function add() {
      const input = document.getElementById('name');

      if (!input.value.trim()) return;

      habits.push({
        name: input.value.trim(),
        done: false,
        completedDates: []
      });

      input.value = '';

      save();
      render();
    }

    // Удаление привычки
    function removeHabit(index) {
      const habit = habits[index];

      const doRemove = () => {
        habits = habits.filter(h => h !== habit);
        save();
        render();
      };

      if (tg.showConfirm) {
        tg.showConfirm(
          'Удалить привычку «' + habit.name + '»?',
          (ok) => {
            if (ok) doRemove();
          }
        );
      } else if (confirm('Удалить привычку «' + habit.name + '»?')) {
        doRemove();
      }
    }

    // Загрузка сохранённых данных
    tg.CloudStorage.getItem('habits', (err, value) => {
      if (err) {
        alert('Не удалось загрузить привычки');
        return;
      }

      try {
        habits = value ? JSON.parse(value) : [];

        let migrated = false;

        habits.forEach(h => {
          if (!Array.isArray(h.completedDates)) {
            h.completedDates = h.done ? [today()] : [];
            migrated = true;
          }
        });

        if (migrated) save();

        loaded = true;

        document.getElementById('addButton').disabled = false;

        render();
      } catch (error) {
        alert('Ошибка загрузки сохранённых данных');
      }
    });

    // Автоматическое обновление при смене дня
    setInterval(() => {
      if (loaded && today() !== lastDate) {
        render();
      }
    }, 1000);

    // Обновление при возвращении в приложение
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) render();
    });

    window.addEventListener('focus', render);
  </script>
</body>
</html>
